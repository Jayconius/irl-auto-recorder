services:
  recorder:
    build: .
    image: irl-auto-recorder
    container_name: irl-auto-recorder
    restart: unless-stopped
    # Host networking so the recorder reaches the receiver on 127.0.0.1.
    network_mode: host
    # Runs as your user so recordings are owned by you, not root.
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      RECORDINGS_DIR: /recordings
    volumes:
      - ${RECORDINGS_PATH:-./recordings}:/recordings
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
